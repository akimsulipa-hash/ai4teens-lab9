<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Форма зворотного зв'язку | AI4Teens</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

  <main>
    <h1>Зв'яжіться з нами</h1>

    <form id="feedbackForm" novalidate>

      <div>
        <label for="username">Ім'я</label>
        <input type="text" id="username" name="username" autocomplete="name">
        <p id="usernameError" class="hidden"></p>
      </div>

      <div>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email">
        <p id="emailError" class="hidden"></p>
      </div>

      <div>
        <label for="phone">Телефон</label>
        <input type="tel" id="phone" name="phone" autocomplete="tel">
        <p id="phoneError" class="hidden"></p>
      </div>

      <div>
        <label for="message">Повідомлення</label>
        <textarea id="message" name="message" rows="5"></textarea>
        <p id="messageError" class="hidden"></p>
      </div>

      <div>
        <input type="checkbox" id="agreement" name="agreement">
        <label for="agreement">Погоджуюсь з політикою конфіденційності</label>
        <p id="agreementError" class="hidden"></p>
      </div>

      <button type="submit">Надіслати</button>

    </form>
  </main>

  <div id="successModal" class="hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div>
      <h2 id="modalTitle">Дякуємо!</h2>
      <p>Форма успішно пройшла клієнтську валідацію. Демонстрація успішного надсилання.</p>
      <button type="button" id="closeModal">Закрити</button>
    </div>
  </div>

  <script src="assets/js/validation.js"></script>
</body>
</html>
